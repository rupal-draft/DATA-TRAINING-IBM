name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            👋 Hi there!
            Thanks for opening your first issue in this repository 🎉
            We really appreciate you taking the time to help improve the project.
            A maintainer will take a look soon—welcome to the community!
          pr-message: >
            🎉 Thank you for your first contribution to this repository!
            We’re excited to have you as a contributor and appreciate the effort you put into this PR.
            A maintainer will review it shortly—welcome aboard 🚀
